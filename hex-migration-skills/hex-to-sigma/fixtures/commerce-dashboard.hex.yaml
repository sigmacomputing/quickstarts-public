    cellId: 019fb3d4-b153-7775-897a-c66d881fb735 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: commerce_joined
    config:
      source: |-
        SELECT
          c."Visit ID",
          c."Date",
          YEAR(c."Date") AS "Year",
          c."Revenue",
          c."Quantity",
          b."Brand",
          cat."Category",
          ctry."Country"
        FROM QUICKSTARTS.HEX_ECOMMERCE.COMMERCE c
        JOIN QUICKSTARTS.HEX_ECOMMERCE.BRAND b ON c."Brand ID" = b."Brand ID"
        JOIN QUICKSTARTS.HEX_ECOMMERCE.CATEGORY cat ON c."Category ID" = cat."Category ID"
        JOIN QUICKSTARTS.HEX_ECOMMERCE.COUNTRY ctry ON c."Country ID" = ctry."Country ID";
