<!doctype html>
<html><head><meta charset="utf-8"><title>Domo semicircle gauge</title>
<style>
html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
svg{display:block;width:100%;height:100%}
</style></head><body><div id="root"><svg id="g"></svg></div>
<script src="./react.production.min.js"></script>
<script src="./sigma-plugin-sdk.umd.js"></script>
<script>
(function(){
  var svg=document.getElementById("g"),last={value:50,target:100,format:"int"};
  function fmt(n,f){if((f||"").indexOf("%")>=0){var m=(f||"").match(/\.(\d+)/);return(Number(n)*100).toFixed(m?Number(m[1]):0)+"%"}return Math.round(Number(n)).toLocaleString()}
  function point(cx,cy,r,deg){var a=(deg-180)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}}
  function arc(cx,cy,r,a,b){var s=point(cx,cy,r,b),e=point(cx,cy,r,a);return"M "+s.x+" "+s.y+" A "+r+" "+r+" 0 0 0 "+e.x+" "+e.y}
  function draw(value,target,format){
    last={value:value,target:target,format:format};var box=svg.getBoundingClientRect(),w=Math.max(80,box.width),h=Math.max(60,box.height);
    svg.setAttribute("viewBox","0 0 "+w+" "+h);var sw=Math.max(7,Math.min(w,h)*.09),cx=w/2,cy=h*.82,r=Math.max(18,Math.min(w*.36,h*.65));
    var frac=target>0?Math.max(0,Math.min(1,Number(value)/Number(target))):0;
    svg.innerHTML='<path d="'+arc(cx,cy,r,0,180)+'" fill="none" stroke="#e5e7eb" stroke-width="'+sw+'" stroke-linecap="round"/>'+
      '<path d="'+arc(cx,cy,r,0,180*frac)+'" fill="none" stroke="#78b94b" stroke-width="'+sw+'" stroke-linecap="round"/>'+
      '<text x="'+cx+'" y="'+(cy-r*.08)+'" text-anchor="middle" font-size="'+Math.max(13,h*.18)+'" font-weight="600" fill="#4b5563">'+fmt(value,format)+'</text>';
  }
  draw(50,100,"int");
  var client=window.SigmaPlugin&&window.SigmaPlugin.client;
  if(client){
    client.config.configureEditorPanel([
      {name:"source",type:"element"},
      {name:"value",type:"column",source:"source",allowMultiple:false},
      {name:"target",type:"column",source:"source",allowMultiple:false},
      {name:"format",type:"text"}
    ]);
    var stop=null;
    function cid(v){return v&&typeof v==="object"?v.columnId:v}
    function bind(c){var src=c&&c.source;if(src&&typeof src==="object")src=src.elementId;if(stop){stop();stop=null}if(!src)return;
      stop=client.elements.subscribeToElementData(src,function(data){var v=cid(c.value),t=cid(c.target);if(data&&data[v]&&data[t])draw(data[v][0],data[t][0],c.format)})}
    client.config.subscribe(bind);Promise.resolve(client.config.get()).then(bind);
  }
  var frame=null;new ResizeObserver(function(){if(frame)cancelAnimationFrame(frame);frame=requestAnimationFrame(function(){draw(last.value,last.target,last.format)})}).observe(svg);
})();
</script></body></html>
