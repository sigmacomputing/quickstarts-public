<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sigma workbook</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #status { padding: 12px; font-size: 14px; color: #555; }
      #workbook { display: none; border: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="status">Loading workbook...</div>
    <iframe id="workbook" allow="clipboard-write"></iframe>
    <script>
      // Minimal MCP Apps view: complete the ui/initialize handshake with the
      // host, then show the workbook URL delivered in the tool result.
      const VIEW_HEIGHT = 720;
      const status = document.getElementById("status");
      const frame = document.getElementById("workbook");
      const pending = new Map();
      let nextId = 1;

      function send(message) {
        window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");
      }

      function request(method, params) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          send({ id, method, params });
        });
      }

      function showWorkbook(result) {
        const url = result && result.structuredContent && result.structuredContent.embedUrl;
        if (!url) {
          status.textContent = "No workbook was returned.";
          return;
        }
        frame.src = url;
        frame.style.display = "block";
        status.style.display = "none";
        send({ method: "ui/notifications/size-changed", params: { height: VIEW_HEIGHT } });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === undefined && message.id !== undefined) {
          const waiting = pending.get(message.id);
          if (!waiting) return;
          pending.delete(message.id);
          if (message.error) waiting.reject(message.error);
          else waiting.resolve(message.result);
        } else if (message.method === "ui/notifications/tool-result") {
          showWorkbook(message.params);
        } else if (message.method === "ping" && message.id !== undefined) {
          send({ id: message.id, result: {} });
        } else if (message.id !== undefined) {
          send({ id: message.id, error: { code: -32601, message: "Method not found" } });
        }
      });

      request("ui/initialize", {
        appInfo: { name: "sigma-workbook-view", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      })
        .then(() => send({ method: "ui/notifications/initialized" }))
        .catch(() => { status.textContent = "Could not connect to the host."; });
    </script>
  </body>
</html>
